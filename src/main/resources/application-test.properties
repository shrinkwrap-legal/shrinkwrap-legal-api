download-missing-judicature=true

# database
# Datasource (url/username/password/driver) is provided by the Testcontainers
# pgvector container via @ServiceConnection - see TestcontainersConfiguration.
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# embeddings need an OpenAI API key, so keep disabled by default in tests;
# the pgvector column itself is created because the container has the extension.
generate-embeddings=false