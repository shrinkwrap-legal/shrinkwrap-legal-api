
spring.application.name=Shrinkwrap Legal API

# Actuator exposure for monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.access=read_only
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true


# use new java 21 virtual threads
spring.threads.virtual.enabled=true

# modulith event driven
#spring.modulith.republish-outstanding-events-on-restart=true
#spring.modulith.events.jdbc.schema-initialization.enabled=true

# spring ai
spring.ai.openai.api-key=
spring.ai.openai.chat.options.model==gpt-5.4-nano

spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=mistral

# recommendation from logs
spring.jpa.open-in-view=false

# springdocs

logging.file.name=shrinkwrap-api.log
logging.level.org.springframework.web=info
logging.level.org.springframework.http=info

logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=3GB
logging.logback.rollingpolicy.clean-history-on-start=false


files.output-directory=c:/tmp/shrinkwrap

#download missing files in development
download-missing-judicature=false
generate-embeddings=true
min-words-for-summary=150


# database for development
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:shrinkwrap
spring.datasource.username=sa
spring.datasource.password=
# spring.jpa.generate-ddl=true
spring.jpa.show-sql=true

spring.datasource.hikari.idleTimeout: 120000

#matomo
matomo.tracker.enabled=false


# base for root-relative document references in RIS norm html (e.g. the sign images in § 50 StVO)
ris.norm.document-base-url=https://ris.bka.gv.at
# which laws the initial import and the nightly update take, by the RIS type field:
# BG federal act, LG state act, V regulation. "*" takes everything - narrow it on a staging
# system, e.g. ris.norm.import-types=BG,LG,Gesetz,Landesgesetz,LVG,VG,G
ris.norm.import-types=*
